# Runs the extension in Roam's real desktop app (Linux build, under Xvfb), signed in to a hosted test
# graph, and checks that the sidebar comes back after a restart. See test/real-roam/run.mjs.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions): ROAM_EMAIL and
# ROAM_PASSWORD, for a Roam account that can open the test graph. Optional repository variable
# ROAM_GRAPH (default vault-spike-hosted). Without the secrets, or on a pull request from a fork
# (GitHub withholds secrets there), the run is skipped with a notice.
name: Real Roam

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/real-roam/**'
      - 'package*.json'
      - '.github/workflows/real-roam.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: every run signs in to the same account and graph.
concurrency:
  group: real-roam
  cancel-in-progress: false

jobs:
  real-roam:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROAM_VERSION: 0.0.42
      ROAM_DEB_SHA512: x9Ln56V7TlDO6zDcXK0AKDeAmz5LSX1oWpKbV6w7CUzbMc/LESJ7qLQs0Ap/nPpwPCf7jUypd0LS05SsJbD/HA==
      OUT: ${{ github.workspace }}/real-roam-out
    steps:
      - name: Check for the Roam test account secrets
        id: creds
        env:
          HAS_EMAIL: ${{ secrets.ROAM_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.ROAM_PASSWORD != '' }}
        run: |
          if [ "$HAS_EMAIL" = true ] && [ "$HAS_PASSWORD" = true ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: add the ROAM_EMAIL and ROAM_PASSWORD repository secrets to run the extension in real Roam."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the extension
        if: steps.creds.outputs.ok == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Cache the Roam installer
        if: steps.creds.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: ~/roam-deb
          key: roam-deb-${{ env.ROAM_VERSION }}

      - name: Install Roam, Xvfb and Playwright
        if: steps.creds.outputs.ok == 'true'
        run: |
          mkdir -p ~/roam-deb
          deb=~/roam-deb/roam-research_${ROAM_VERSION}_amd64.deb
          [ -f "$deb" ] || curl -fsSL -o "$deb" "https://roam-electron-deploy.s3.us-east-2.amazonaws.com/roam-research_${ROAM_VERSION}_amd64.deb"
          echo "$(echo "$ROAM_DEB_SHA512" | base64 -d | od -An -v -tx1 | tr -d ' \n')  $deb" | sha512sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$deb" xvfb
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.63.0

      - name: Run the extension in real Roam
        if: steps.creds.outputs.ok == 'true'
        env:
          ROAM_EMAIL: ${{ secrets.ROAM_EMAIL }}
          ROAM_PASSWORD: ${{ secrets.ROAM_PASSWORD }}
          ROAM_GRAPH: ${{ vars.ROAM_GRAPH || 'vault-spike-hosted' }}
        run: |
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node test/real-roam/run.mjs

      - name: Summary
        if: always() && steps.creds.outputs.ok == 'true'
        run: '[ -f "$OUT/RESULTS.md" ] && cat "$OUT/RESULTS.md" >> "$GITHUB_STEP_SUMMARY" || true'

      - uses: actions/upload-artifact@v4
        if: always() && steps.creds.outputs.ok == 'true'
        with:
          name: real-roam-results
          path: real-roam-out/
          if-no-files-found: ignore
          retention-days: 14
